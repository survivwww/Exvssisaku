<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101a2a">
<title>EXTREME DUEL - 2v2</title>
<style>
:root{color-scheme:dark;--cyan:#53e8ff;--red:#ff5368;--gold:#ffd86b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a2a;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;touch-action:none}
#game{display:block;width:100vw;height:100dvh;background:#121e30}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 3px #000}
.top{position:absolute;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.panel{background:#08111dcc;border:1px solid #ffffff38;border-radius:10px;padding:7px 10px;backdrop-filter:blur(4px);min-width:100px}
.small{font-size:10px;letter-spacing:.08em;color:#b8d9e8}.value{font-weight:900;font-size:16px}
.bar{height:7px;background:#27394b;border-radius:9px;overflow:hidden;margin-top:4px;width:100%}.fill{height:100%;width:100%;background:linear-gradient(90deg,#48e8c0,#b6ffdc);transition:width .12s}
#enemyBar{background:linear-gradient(90deg,#ff435f,#ff9d65)}
#centerMsg{position:absolute;top:23%;width:100%;text-align:center;font-weight:900;font-size:clamp(18px,5vw,28px);letter-spacing:.12em;color:#fff}
#hint{position:absolute;top:32%;width:100%;text-align:center;font-size:12px;color:#c5e6f5}
.controls{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));height:150px;pointer-events:none}
#stickZone{position:absolute;left:14px;bottom:5px;width:130px;height:130px;border-radius:50%;background:#ffffff12;border:1px solid #ffffff40;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;background:#d9f8ff55;border:2px solid #c8f8ff;box-shadow:0 0 18px #53e8ff35}
.buttons{position:absolute;right:12px;bottom:0;width:210px;height:145px;pointer-events:none}
.btn{position:absolute;border:1px solid #ffffff8c;border-radius:50%;color:white;font-weight:900;text-shadow:0 1px 3px #000;box-shadow:inset 0 0 16px #ffffff15,0 4px 10px #0006;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;user-select:none}
.btn:active{filter:brightness(1.35);transform:scale(.96)}
#shoot{right:8px;bottom:14px;width:76px;height:76px;background:#ff4f6388;font-size:14px}
#dash{right:91px;bottom:10px;width:57px;height:57px;background:#35c9ff77;font-size:11px}
#lock{right:78px;bottom:75px;width:48px;height:48px;background:#ffd65c77;font-size:10px}
#melee{right:145px;bottom:59px;width:54px;height:54px;background:#bd6dff77;font-size:11px}
#special{right:145px;bottom:0;width:45px;height:45px;background:#ff9e4b77;font-size:10px}
#restart{position:absolute;top:57%;left:50%;transform:translateX(-50%);pointer-events:auto;border:1px solid #fff8;border-radius:10px;padding:10px 18px;background:#132a42;color:white;font-weight:800;display:none}
#target{position:absolute;right:10px;top:92px;text-align:right;font-size:11px;color:#ffd1d8}
#bottomNote{position:absolute;left:12px;bottom:154px;font-size:10px;color:#d0e8f1aa}
@media(min-width:700px){.controls{max-width:780px;left:50%;transform:translateX(-50%);width:100%} .top{max-width:900px;left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 20px)}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="top">
  <div class="panel" style="width:31%">
   <div class="small">PLAYER / TEAM A</div><div class="value" id="playerText">HP 1000</div><div class="bar"><div class="fill" id="playerBar"></div></div>
   <div class="small" style="margin-top:5px">ALLY <span id="allyText">1000</span></div><div class="bar"><div class="fill" id="allyBar"></div></div>
  </div>
  <div class="panel" style="text-align:center;min-width:90px"><div class="small">TIME</div><div class="value" id="timeText">180</div><div class="small">TEAM A : TEAM B</div><div class="value"><span id="scoreA">2</span> : <span id="scoreB">2</span></div></div>
  <div class="panel" style="width:31%">
   <div class="small">ENEMY 1</div><div class="value" id="enemy1Text">HP 1000</div><div class="bar"><div class="fill" id="enemy1Bar" style="background:linear-gradient(90deg,#ff435f,#ff9d65)"></div></div>
   <div class="small" style="margin-top:5px">ENEMY 2 <span id="enemy2Text">1000</span></div><div class="bar"><div class="fill" id="enemy2Bar" style="background:linear-gradient(90deg,#ff435f,#ff9d65)"></div></div>
  </div>
 </div>
 <div id="target">LOCK: ENEMY 1</div>
 <div id="centerMsg">EXTREME DUEL</div><div id="hint">移動して照準を合わせ、射撃で攻撃！</div>
 <div id="bottomNote">横画面推奨 · 左スティック：移動 / LOCK：敵切替</div>
 <button id="restart">もう一度出撃</button>
 <div class="controls">
  <div id="stickZone"><div id="stick"></div></div>
  <div class="buttons">
   <div class="btn" id="shoot">射撃</div><div class="btn" id="dash">ブースト</div><div class="btn" id="lock">ロック</div><div class="btn" id="melee">格闘</div><div class="btn" id="special">SP</div>
  </div>
 </div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1, last=0, elapsed=0, gameOver=false, winner='', targetIndex=2, fireHeld=false, move={x:0,y:0}, keys={};
const $=id=>document.getElementById(id);
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const arena={w:1500,h:1000};
let units=[], shots=[], particles=[], scoreA=2,scoreB=2;
function makeUnit(name,team,x,y,color,player=false){
 return {name,team,x,y,vx:0,vy:0,r:player?20:21,hp:1000,maxHp:1000,color,player,alive:true,respawn:0,fire:0,melee:0,special:0,dash:0,stun:0,aiTimer:0,face:team===0?0:Math.PI,seed:Math.random()*9,boost:1000};
}
function reset(){
 units=[makeUnit('YOU',0,350,500,'#4de9ff',true),makeUnit('ALLY',0,440,650,'#54ffbd'),makeUnit('ENEMY 1',1,1120,400,'#ff546d'),makeUnit('ENEMY 2',1,1180,650,'#ffb04d')];
 shots=[];particles=[];elapsed=0;gameOver=false;winner='';targetIndex=2;scoreA=2;scoreB=2;
 $('centerMsg').textContent='EXTREME DUEL';$('hint').textContent='移動して照準を合わせ、射撃で攻撃！';$('restart').style.display='none';$('scoreA').textContent=scoreA;$('scoreB').textContent=scoreB;
}
reset();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function targetFor(u){let opts=units.filter(v=>v.team!==u.team&&v.alive);if(!opts.length)return null;if(u.player){let t=units[targetIndex];return t&&t.alive?t:opts[0]}return opts.sort((a,b)=>dist(u,a)-dist(u,b))[0]}
function angleTo(a,b){return Math.atan2(b.y-a.y,b.x-a.x)}
function burst(x,y,color,n=8){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=35+Math.random()*150;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.45,max:.7,color,r:2+Math.random()*3})}}
function shoot(u,spread=0,speed=560,damage=55,color=null){
 if(!u.alive||u.fire>0||u.stun>0)return;let t=targetFor(u);if(!t)return;
 let a=angleTo(u,t)+spread+(Math.random()-.5)*.035;u.face=a;u.fire=u.player?.23:.6+Math.random()*.25;
 shots.push({x:u.x+Math.cos(a)*u.r,y:u.y+Math.sin(a)*u.r,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,team:u.team,owner:u,damage,color:color||u.color,life:1.8,r:5});
 burst(u.x+Math.cos(a)*u.r,u.y+Math.sin(a)*u.r,color||u.color,3);
}
function melee(u){if(!u.alive||u.melee>0)return;let t=targetFor(u);if(!t)return;u.melee=.7;let d=dist(u,t);if(d<105){let a=angleTo(u,t);if(Math.abs(Math.atan2(Math.sin(a-u.face),Math.cos(a-u.face)))<1.7){hit(t,160,u);burst(t.x,t.y,'#e9a7ff',15)}}else{u.face=angleTo(u,t);}}
function special(u){if(!u.alive||u.special>0)return;u.special=5;let t=targetFor(u);if(!t)return;let a=angleTo(u,t);u.face=a;for(let i=-2;i<=2;i++)shots.push({x:u.x+Math.cos(a)*u.r,y:u.y+Math.sin(a)*u.r,vx:Math.cos(a+i*.09)*650,vy:Math.sin(a+i*.09)*650,team:u.team,owner:u,damage:75,color:'#ffe36b',life:1.5,r:7});burst(u.x,u.y,'#ffe36b',18)}
function hit(u,damage,owner){if(!u.alive)return;u.hp-=damage;u.stun=.12;burst(u.x,u.y,u.color,5);if(u.hp<=0){u.hp=0;u.alive=false;u.respawn=3.5;burst(u.x,u.y,'#ffffff',28);if(owner.team===0)scoreA++;else scoreB++;$('scoreA').textContent=scoreA;$('scoreB').textContent=scoreB}}
function update(dt){
 if(gameOver)return;
 elapsed+=dt;let remaining=Math.max(0,180-elapsed);
 if(remaining<=0){gameOver=true;winner=scoreA>scoreB?'TEAM A WIN':scoreB>scoreA?'TEAM B WIN':'DRAW';finish();return}
 for(let i=0;i<units.length;i++){
  let u=units[i];u.fire=Math.max(0,u.fire-dt);u.melee=Math.max(0,u.melee-dt);u.special=Math.max(0,u.special-dt);u.stun=Math.max(0,u.stun-dt);u.boost=Math.min(1000,u.boost+dt*180);
  if(!u.alive){u.respawn-=dt;if(u.respawn<=0){u.alive=true;u.hp=1000;u.x=u.team===0?250+Math.random()*180:1080+Math.random()*180;u.y=250+Math.random()*500;u.stun=.7;burst(u.x,u.y,u.color,20)}continue}
  let t=targetFor(u);if(!t)continue;
  let dx=t.x-u.x,dy=t.y-u.y,d=Math.hypot(dx,dy)||1,a=Math.atan2(dy,dx);u.face=a;
  let mx=0,my=0;
  if(u.player){mx=move.x;my=move.y;if(keys.ArrowLeft||keys.a)mx-=1;if(keys.ArrowRight||keys.d)mx+=1;if(keys.ArrowUp||keys.w)my-=1;if(keys.ArrowDown||keys.s)my+=1;let m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m}}
  else{
   let desired=d>300?1:d<190?-0.8:0.12;
   mx=Math.cos(a)*desired+Math.cos(elapsed*1.5+u.seed)*.3;my=Math.sin(a)*desired+Math.sin(elapsed*1.2+u.seed)*.3;
   let m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m}
   if(d<680&&Math.random()<dt*(u.team===0?1.5:1.7))shoot(u,(Math.random()-.5)*.12,u.team===0?530:490,u.team===0?48:52);
   if(d<90&&Math.random()<dt*.6)melee(u);
  }
  if(u.player&&u.dash>0){u.dash=Math.max(0,u.dash-dt);mx*=2.35;my*=2.35}
  let speed=u.player?245:155;
  if(u.stun<=0){u.vx=mx*speed;u.vy=my*speed;u.x+=u.vx*dt;u.y+=u.vy*dt}
  u.x=clamp(u.x,35,arena.w-35);u.y=clamp(u.y,55,arena.h-35);
 }
 for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;let remove=s.life<=0||s.x<0||s.y<0||s.x>arena.w||s.y>arena.h;
  if(!remove)for(let u of units){if(u.alive&&u.team!==s.team&&dist(s,u)<u.r+s.r){hit(u,s.damage,s.owner);remove=true;break}}
  if(remove)shots.splice(i,1);
 }
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
 updateHud(remaining);
}
function updateHud(rem){
 let p=units[0],a=units[1],e=units[2],f=units[3];
 $('playerText').textContent='HP '+Math.ceil(p.hp);$('playerBar').style.width=(p.hp/p.maxHp*100)+'%';
 $('allyText').textContent=Math.ceil(a.hp);$('allyBar').style.width=(a.hp/a.maxHp*100)+'%';
 $('enemy1Text').textContent='HP '+Math.ceil(e.hp);$('enemy1Bar').style.width=(e.hp/e.maxHp*100)+'%';
 $('enemy2Text').textContent=Math.ceil(f.hp);$('enemy2Bar').style.width=(f.hp/f.maxHp*100)+'%';
 $('timeText').textContent=Math.ceil(rem);$('target').textContent='LOCK: '+(units[targetIndex]?.name||'ENEMY');
}
function finish(){$('centerMsg').textContent=winner;$('hint').textContent='撃墜スコア '+scoreA+' : '+scoreB;$('restart').style.display='block'}
function draw(){
 ctx.clearRect(0,0,W,H);
 let scale=Math.min(W/arena.w,H/arena.h)*1.25;let cam=units[0];let cx=clamp(cam.x-W/(2*scale),0,arena.w-W/scale),cy=clamp(cam.y-H/(2*scale),0,arena.h-H/scale);
 ctx.save();ctx.scale(scale,scale);ctx.translate(-cx,-cy);
 ctx.fillStyle='#15283a';ctx.fillRect(0,0,arena.w,arena.h);
 ctx.strokeStyle='#2c4b60';ctx.lineWidth=1;for(let x=0;x<arena.w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,arena.h);ctx.stroke()}for(let y=0;y<arena.h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(arena.w,y);ctx.stroke()}
 // arena walls and cover
 ctx.strokeStyle='#5a8498';ctx.lineWidth=8;ctx.strokeRect(12,12,arena.w-24,arena.h-24);
 const covers=[[560,250,100,65],[810,690,120,60],[760,380,65,100],[300,760,100,55],[1120,250,90,60],[1080,780,90,50]];
 for(let [x,y,w,h] of covers){ctx.fillStyle='#263d50';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#50748a';ctx.lineWidth=3;ctx.strokeRect(x,y,w,h);ctx.fillStyle='#39586c';ctx.fillRect(x+8,y+8,w-16,6)}
 for(let s of shots){ctx.strokeStyle=s.color;ctx.lineWidth=s.r*1.1;ctx.beginPath();ctx.moveTo(s.x-s.vx*.025,s.y-s.vy*.025);ctx.lineTo(s.x,s.y);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r*.45,0,Math.PI*2);ctx.fill()}
 for(let p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
 for(let u of units){
  if(!u.alive){ctx.strokeStyle=u.color+'55';ctx.lineWidth=2;ctx.beginPath();ctx.arc(u.x,u.y,u.r+7+Math.sin(elapsed*8)*3,0,Math.PI*2);ctx.stroke();continue}
  // shadow
  ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(u.x+4,u.y+9,u.r*1.1,u.r*.65,0,0,Math.PI*2);ctx.fill();
  // facing arrow
  ctx.save();ctx.translate(u.x,u.y);ctx.rotate(u.face);
  ctx.fillStyle=u.color;ctx.strokeStyle='#e8faff';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(u.r+7,0);ctx.lineTo(-u.r*.65,-u.r*.7);ctx.lineTo(-u.r*.3,0);ctx.lineTo(-u.r*.65,u.r*.7);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#142334';ctx.beginPath();ctx.arc(0,0,u.r*.48,0,Math.PI*2);ctx.fill();ctx.restore();
  if(u.player){ctx.strokeStyle='#8af6ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(u.x,u.y,u.r+8,0,Math.PI*2);ctx.stroke()}
  let t=targetFor(units[0]);if(t===u){ctx.strokeStyle='#ffd86b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(u.x,u.y,u.r+15,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#ffd86b';ctx.beginPath();ctx.moveTo(u.x-28,u.y);ctx.lineTo(u.x-18,u.y);ctx.moveTo(u.x+18,u.y);ctx.lineTo(u.x+28,u.y);ctx.moveTo(u.x,u.y-28);ctx.lineTo(u.x,u.y-18);ctx.moveTo(u.x,u.y+18);ctx.lineTo(u.x,u.y+28);ctx.stroke()}
  ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(u.name,u.x,u.y-u.r-18);
  ctx.fillStyle='#19232d';ctx.fillRect(u.x-25,u.y-u.r-13,50,5);ctx.fillStyle=u.team===0?'#4de9ff':'#ff5d70';ctx.fillRect(u.x-25,u.y-u.r-13,50*u.hp/u.maxHp,5);
 }
 // reticle toward target
 let t=targetFor(units[0]);if(t&&t.alive){ctx.strokeStyle='#ffe47a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(t.x,t.y,34,0,Math.PI*2);ctx.stroke()}
 ctx.restore();
 // subtle radar
 const rw=76,rh=55,rx=W-rw-12,ry=H*.43;ctx.fillStyle='#07111dbb';ctx.fillRect(rx,ry,rw,rh);ctx.strokeStyle='#a6d9ed66';ctx.strokeRect(rx,ry,rw,rh);
 for(let u of units){if(!u.alive)continue;ctx.fillStyle=u.player?'#fff':u.team===0?'#53e8ff':'#ff5368';ctx.beginPath();ctx.arc(rx+u.x/arena.w*rw,ry+u.y/arena.h*rh,3,0,Math.PI*2);ctx.fill()}
}
function loop(ts){let dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
// touch joystick
const zone=$('stickZone'),stick=$('stick');let stickId=null,origin={x:0,y:0};
function setStick(e){let r=zone.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=43;if(len>max){dx=dx/len*max;dy=dy/len*max}move.x=dx/max;move.y=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}
zone.addEventListener('pointerdown',e=>{stickId=e.pointerId;zone.setPointerCapture(stickId);setStick(e)});
zone.addEventListener('pointermove',e=>{if(e.pointerId===stickId)setStick(e)});
function releaseStick(e){if(e.pointerId===stickId){stickId=null;move.x=move.y=0;stick.style.transform='translate(0,0)'}}
zone.addEventListener('pointerup',releaseStick);zone.addEventListener('pointercancel',releaseStick);
function hold(id,down,up){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);down()});el.addEventListener('pointerup',e=>{e.preventDefault();if(up)up()});el.addEventListener('pointercancel',()=>{if(up)up()})}
hold('shoot',()=>fireHeld=true,()=>fireHeld=false);
hold('dash',()=>{if(units[0].boost>=180){units[0].boost-=180;units[0].dash=.25;burst(units[0].x,units[0].y,'#53e8ff',10)}});
hold('melee',()=>melee(units[0]));
hold('special',()=>special(units[0]));
hold('lock',()=>{let alive=[2,3].filter(i=>units[i].alive);if(alive.length){let pos=alive.indexOf(targetIndex);targetIndex=alive[(pos+1)%alive.length]??alive[0];$('target').textContent='LOCK: '+units[targetIndex].name}});
$('restart').addEventListener('click',reset);
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();fireHeld=true}if(e.key==='Shift'){units[0].dash=.25}if(e.key.toLowerCase()==='j')melee(units[0]);if(e.key.toLowerCase()==='k')special(units[0])});
addEventListener('keyup',e=>{keys[e.key]=false;if(e.key===' ')fireHeld=false});
setInterval(()=>{if(fireHeld&&!gameOver)shoot(units[0],0,590,58)},80);
})();
</script>
</body>
</html>
