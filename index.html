<style>
:root{color-scheme:dark;--cyan:#56eaff;--red:#ff536e;--gold:#ffe17b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071321;font-family:system-ui,-apple-system,sans-serif;touch-action:none;overscroll-behavior:none;color:#fff}

.costRow{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:5px}
.costTeam{font:900 8px/1 ui-monospace,SFMono-Regular,monospace;letter-spacing:.06em;color:#eafaff;white-space:nowrap}

.costTicks i{border-right:1px solid #e9fbff70}
.costNum{font:900 10px/1 ui-monospace,SFMono-Regular,monospace;min-width:31px;text-align:right;color:#fff;white-space:nowrap}
.panel{background:#06111c72;border:1px solid #bceaff35;border-radius:5px;padding:4px 9px;backdrop-filter:blur(3px);min-width:0}
.center{min-width:108px;text-align:center}.small{font-size:8px;letter-spacing:.13em;color:#c9e9f5}.val{font-size:13px;font-weight:950;white-space:nowrap}
.bar{height:5px;background:#263849;border-radius:2px;overflow:hidden;margin-top:3px}.fill{height:100%;background:linear-gradient(90deg,#43d9c6,#c4fff0);width:100%}
.red{background:linear-gradient(90deg,#ff3e60,#ffae65)}

.unitHp .hpFill{height:100%;width:100%;background:linear-gradient(90deg,#19c96b,#8bffba);box-shadow:0 0 6px #30ff9c}
.unitHp.enemy .hpFill{background:linear-gradient(90deg,#ff304f,#ff8a96);box-shadow:0 0 6px #ff425d}
.unitHp.ally .hpFill{background:linear-gradient(90deg,#11bd69,#9bffc5)}
#lockMarker{position:fixed;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);border:2px solid #ff536e;border-radius:50%;box-shadow:0 0 10px #ff536e99,inset 0 0 10px #ff536e55;display:none;pointer-events:none;z-index:2}
#lockMarker.lock-green{border-color:#45ef9a;box-shadow:0 0 10px #45ef9a99,inset 0 0 10px #45ef9a55}
#lockMarker.lock-yellow{border-color:#ffe36b;box-shadow:0 0 10px #ffe36b99,inset 0 0 10px #ffe36b55}
#lockMarker.lock-yellow::after{content:"";position:absolute;width:70%;height:2px;left:15%;top:50%;background:#ffe36b;transform:rotate(-45deg);box-shadow:0 0 5px #ffe36b;pointer-events:none}
.lockCorner{position:absolute;width:8px;height:8px;border-color:#ffe17b;border-style:solid}
.lockCorner.a{top:-4px;left:-4px;border-width:2px 0 0 2px}.lockCorner.b{top:-4px;right:-4px;border-width:2px 2px 0 0}.lockCorner.c{bottom:-4px;left:-4px;border-width:0 0 2px 2px}.lockCorner.d{bottom:-4px;right:-4px;border-width:0 2px 2px 0}

#submessage{position:absolute;top:29%;left:0;right:0;text-align:center;font-size:12px;color:#d0e8f4}
#controls{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));left:0;right:0;height:155px;pointer-events:none}

#buttons{position:absolute;right:9px;bottom:0;width:225px;height:150px;pointer-events:none}
.btn{--arc-angle:90deg;--arc-color:#56eaff;position:absolute;border:1px solid #d7f8ffb0;border-radius:50%;color:#f3fbff;font-weight:900;letter-spacing:.04em;text-shadow:0 0 7px #d7faff,0 2px 3px #000;box-shadow:inset 0 0 0 2px #ffffff12,inset 0 0 18px #ffffff18,0 0 12px #1ecbff20,0 4px 10px #0009;background-image:linear-gradient(145deg,#c8f7ff25,#081b30b8 62%,#6ddfff25);display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;user-select:none;font-size:10px;isolation:isolate}

.btn::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1px solid #ffffff25;pointer-events:none}
.btn:active{filter:brightness(1.5);transform:scale(.95)}
#shoot{--arc-color:#ff7189;right:4px;bottom:18px;width:70px;height:70px;background-color:#681d3b99;font-size:14px}
#boost{--arc-color:#56eaff;right:83px;bottom:8px;width:58px;height:58px;background-color:#12445cbb}
#step{--arc-color:#91baff;right:147px;bottom:1px;width:47px;height:47px;background-color:#243c70bb}
#lock{--arc-color:#ffe17b;right:88px;bottom:78px;width:45px;height:45px;background-color:#65501dbb;color:#fff}
#melee{--arc-color:#d7a0ff;right:151px;bottom:57px;width:53px;height:53px;background-color:#51296fbb}
#special{--arc-color:#ffbc72;right:24px;bottom:91px;width:48px;height:48px;background-color:#71401fbb}
#restart{position:absolute;top:56%;left:50%;transform:translateX(-50%);pointer-events:auto;border:1px solid #fff9;border-radius:10px;padding:11px 18px;background:#112b43;color:#fff;font-weight:900;display:none}
#setup{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(#071321dd,#071321f2);padding:20px}
.setupCard{width:min(440px,100%);border:1px solid #a9eaff55;border-radius:18px;padding:22px;background:#0a1b2b;box-shadow:0 20px 70px #0009}
h1{margin:0 0 4px;font-size:25px;letter-spacing:.06em} .subtitle{color:#a8c9da;font-size:12px;margin-bottom:18px}
label{display:block;font-size:12px;color:#c7e5f2;margin:12px 0 5px}
select{width:100%;padding:12px;border-radius:9px;border:1px solid #66869b;background:#132a3d;color:#fff;font-size:15px}
#start{width:100%;padding:14px;border:0;border-radius:10px;margin-top:18px;background:linear-gradient(90deg,#2ecbe9,#6c9cff);color:#061321;font-weight:1000;font-size:16px}
.note{font-size:11px;color:#93b4c5;line-height:1.6;margin-top:12px}
@media(min-width:700px){#controls{width:min(780px,100%);left:50%;transform:translateX(-50%)}.top{left:50%;right:auto;transform:translateX(-50%)}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){$('submessage').textContent='3Dライブラリを読み込めません。通信状態を確認して再読み込みしてください。';return}
const THREE=window.THREE, canvas=$('view');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87c9f2);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,450);
// Combat camera state: all positions are derived from the player/lock target each frame.
const cameraForward=new THREE.Vector3(1,0,0);
const desiredForward=new THREE.Vector3(0,0,-1);
const cameraDesiredPosition=new THREE.Vector3();
const cameraLookTarget=new THREE.Vector3();
const cameraDesiredLook=new THREE.Vector3();
let combatCameraReady=false;
scene.add(new THREE.HemisphereLight(0xdaf2ff,0x4e7540,1.65));
const sun=new THREE.DirectionalLight(0xfff0c9,2.25);sun.position.set(-38,52,-42);sun.castShadow=true;scene.add(sun);
// Visible sun disk in the open sky; lighting is provided by the directional light above.
const sunDisk=new THREE.Mesh(new THREE.SphereGeometry(4.2,24,16),new THREE.MeshBasicMaterial({color:0xffe7a0}));sunDisk.position.set(-62,48,-82);scene.add(sunDisk);
const sunHalo=new THREE.Mesh(new THREE.SphereGeometry(6.2,24,16),new THREE.MeshBasicMaterial({color:0xffd56a,transparent:true,opacity:.16,depthWrite:false}));sunHalo.position.copy(sunDisk.position);scene.add(sunHalo);
const arena=116;
function groundHeight(x,z){return 1.75*Math.sin(x*.047)*Math.cos(z*.043)+1.05*Math.sin((x+z)*.052)+0.55*Math.cos(z*.085)+0.45*Math.sin((x-z)*.078)}
const terrainGeo=new THREE.PlaneGeometry(arena,arena,112,112);
const pos=terrainGeo.attributes.position;
for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=-pos.getY(i);pos.setZ(i,groundHeight(x,z))}
terrainGeo.computeVertexNormals();
const floor=new THREE.Mesh(terrainGeo,new THREE.MeshStandardMaterial({color:0x4f963b,roughness:1,metalness:0}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const mat=(c,metal=.35,rough=.5)=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough});
const coverMat=mat(0x304a5e,.65,.6), buildings=[];
const buildingSpecs=[[-15,-12,5,4,2.5],[14,13,6,4,2.8],[-28,20,4,7,2.2],[29,-19,5,4,2.6],[2,28,7,4,2.4],[-3,-30,6,4,2.3],[34,9,4,6,2.5],[-35,-8,5,5,2.7]];
for(const [x,z,w,d,h] of buildingSpecs){
 const base=groundHeight(x,z),m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),coverMat);m.position.set(x,base+h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);
 const stripe=new THREE.Mesh(new THREE.BoxGeometry(w*.78,.06,.08),mat(0x4fcde8,.2,.4));stripe.position.set(x,base+h*.68,z-d/2-.045);scene.add(stripe);
 buildings.push({x,z,w,d,h,base});
}
// No visible arena grid or wireframe boundary: keep the field natural and open.
function resolveBuildingCollision(u,oldX,oldZ){
 for(const b of buildings){const pad=.72,insideX=Math.abs(u.x-b.x)<b.w/2+pad,insideZ=Math.abs(u.z-b.z)<b.d/2+pad;
  if(insideX&&insideZ){const ox=Math.abs(oldX-b.x)/(b.w/2+pad),oz=Math.abs(oldZ-b.z)/(b.d/2+pad);if(ox>oz)u.x=oldX;else if(oz>ox)u.z=oldZ;else{const px=b.w/2+pad-Math.abs(u.x-b.x),pz=b.d/2+pad-Math.abs(u.z-b.z);if(px<pz)u.x=b.x+Math.sign(u.x-b.x||1)*(b.w/2+pad);else u.z=b.z+Math.sign(u.z-b.z||1)*(b.d/2+pad)}u.vx*=.25;u.vz*=.25;}
 }
}
const projectileGroup=new THREE.Group();scene.add(projectileGroup);const effects=[];
let units=[],shots=[],elapsed=0,started=false,over=false,targetIndex=2,costA=6000,costB=6000,fireHeld=false,move={x:0,y:0},keys={},difficulty='normal',last=performance.now();let boostPressActive=false,boostPressStarted=0,boostMode='',boostHoldTimer=null,lastBoostTap=-9999;
const hpEls=[];for(let i=0;i<4;i++){const el=document.createElement('div');el.className='unitHp '+(i===0?'player':i===1?'ally':'enemy');el.innerHTML='<div class="hpName"></div><div class="hpTrack"><div class="hpFill"></div></div>';el.style.display='none';$('unitHpLayer').appendChild(el);hpEls.push(el)}
const stats={
 balanced:{hp:1000,speed:9.2,shot:54,shotDown:34,rate:.88,ammo:8,reload:1.25,melee:155,meleeDown:0,specialDown:20,redLockRange:arena/2,boost:1000,regen:520,cost:3000,color:0x42dff5},
 ranged:{hp:1000,speed:8.7,shot:75,shotDown:34,rate:1.02,ammo:10,reload:1.05,melee:120,meleeDown:0,specialDown:20,redLockRange:arena/2,boost:1000,regen:500,cost:3000,color:0x9c88ff},
 melee:{hp:1100,speed:9.1,shot:40,shotDown:34,rate:1.12,ammo:5,reload:1.45,melee:220,meleeDown:0,specialDown:20,redLockRange:arena/2,boost:950,regen:540,cost:3000,color:0xff7ec8},
 light:{hp:850,speed:11.4,shot:48,shotDown:34,rate:.78,ammo:7,reload:1.3,melee:125,meleeDown:0,specialDown:20,redLockRange:arena/2,boost:1200,regen:590,cost:2000,color:0x73ffb0}
};
let prinzEugenTemplate=null;
const modelStatus=$('modelStatus'),startButton=$('start');
const gltfLoader=new THREE.GLTFLoader();
gltfLoader.load('prinzeugen.glb',gltf=>{
 prinzEugenTemplate=gltf.scene;
 modelStatus.textContent='プリンツ・オイゲンのモデル読み込み完了';
 startButton.disabled=false;startButton.textContent='出撃する';
},undefined,error=>{
 console.error('Prinz Eugen GLB load failed:',error);
 modelStatus.textContent='モデルを読み込めません。index.htmlとprinzeugen.glbを同じフォルダに置いてください。';
 startButton.disabled=false;startButton.textContent='簡易モデルで出撃';
});
function createUnitVisual(kind,color,player){
 if(kind==='light'&&prinzEugenTemplate){
  const model=THREE.SkeletonUtils.clone(prinzEugenTemplate);
  model.scale.setScalar(2.3/20.953943252563477);
  model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  model.userData.isPrinzEugen=true;
  // Keep the original GLB skeleton intact. Head tracking is an additive pose
  // applied only to the existing Japanese-named neck/head bones.
  const neck=model.getObjectByName('首')||model.getObjectByName('Neck');
  const head=model.getObjectByName('頭')||model.getObjectByName('Head');
  if(neck&&head){
   model.userData.headRig={
    neck,head,
    neckBase:neck.quaternion.clone(),
    headBase:head.quaternion.clone(),
    yaw:0,pitch:0
   };
  }else{
   console.warn('Prinz Eugen head tracking bones not found:',{neck:!!neck,head:!!head});
  }
  return model;
 }
 return robotMesh(color,player);
}
function robotMesh(color,player=false){
 const root=new THREE.Group(), body=mat(color,.65,.3), dark=mat(0x152637,.65,.35), glow=mat(0x9cf7ff,.25,.18), joint=mat(0x516b7b,.8,.35);
 const add=(geo,m,x,y,z,parent=root)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o};
 add(new THREE.BoxGeometry(.9,1.05,.52),body,0,1.45,0);
 const headPivot=new THREE.Group();headPivot.position.set(0,2.08,0);root.add(headPivot);

    }

   if(u.step>0){u.vx*=Math.max(0,1-dt*1.5);u.vz*=Math.max(0,1-dt*1.5)}
   const oldX=u.x,oldZ=u.z;u.x+=u.vx*dt;u.z+=u.vz*dt;u.y+=u.vy*dt;

  }else{const oldX=u.x,oldZ=u.z;u.vx+=(mx*speed-u.vx)*Math.min(1,5*dt);u.vz+=(mz*speed-u.vz)*Math.min(1,5*dt);u.x+=u.vx*dt;u.z+=u.vz*dt;u.x=clamp(u.x,-arena/2+1,arena/2-1);u.z=clamp(u.z,-arena/2+1,arena/2-1);resolveBuildingCollision(u,oldX,oldZ);u.y=groundHeight(u.x,u.z);}

function updateHud(){

 const t=units[targetIndex];$('lockInfo').textContent='LOCK: '+(t&&t.alive?t.name:'AUTO TARGET');const p=units[0];
 if(p){const boostBar=$('boostBar'),boostRatio=p.boost/p.maxBoost;$('boostFill').style.width=(boostRatio*100)+'%';boostBar.classList.toggle('boost-yellow',boostRatio<.6&&boostRatio>=.3);boostBar.classList.toggle('boost-red',boostRatio<.3&&boostRatio>0);boostBar.classList.toggle('overheat',p.boost<=0);const arc=(id,ratio)=>$(id).style.setProperty('--arc-angle',(Math.max(0,Math.min(1,ratio))*90)+'deg');const reloadProgress=p.ammo<p.maxAmmo?Math.max(0,Math.min(1,1-p.ammoReload/Math.max(.01,p.stats.reload))):0;arc('shoot',(p.ammo+reloadProgress)/p.maxAmmo);arc('boost',p.boost/p.maxBoost);arc('melee',1-p.melee/.72);arc('special',1-p.special/5);arc('step',1-p.step/.32);arc('lock',1)}

function updateUnitHp(){

  const u=units[i],el=hpEls[i];if(!u||!u.alive||!started){el.style.display='none';continue}

// EXVS-inspired lock-on chase camera. The camera is calculated from absolute
// world positions every frame (never by adding offsets to its previous position),
// which prevents movement-dependent drift and button-triggered snapping.
function updateCombatCamera(p,t,dt){
 // Camera orbit follows the player-to-lock-target direction, independently
 // from the unit's body yaw. Restore the pre-maximum follow response.
 const hasTarget=!!(t&&t.alive);
 if(hasTarget) desiredForward.set(t.x-p.x,0,t.z-p.z);
 else desiredForward.set(-Math.sin(p.face),0,-Math.cos(p.face));
 if(desiredForward.lengthSq()<1e-6)desiredForward.set(0,0,-1);
 desiredForward.normalize();

 const forwardBlend=1-Math.exp(-7.8*Math.max(0,dt));
 if(!combatCameraReady)cameraForward.copy(desiredForward);
 else cameraForward.lerp(desiredForward,forwardBlend).normalize();

 const targetDistance=hasTarget?Math.hypot(t.x-p.x,t.z-p.z):18;
 const followDistance=7.2+clamp(targetDistance*.045,0,2.4);
 const cameraHeight=4.2+clamp(targetDistance*.015,0,.65);
 cameraDesiredPosition.set(
  p.x-cameraForward.x*followDistance,
  p.y+cameraHeight,
  p.z-cameraForward.z*followDistance
 );

 if(!combatCameraReady){
  camera.position.copy(cameraDesiredPosition);
  combatCameraReady=true;
 }else{
  const positionBlend=1-Math.exp(-10.2*Math.max(0,dt));
  camera.position.lerp(cameraDesiredPosition,positionBlend);
 }

 // Aim at the midpoint between the player's and target's torso anchors.
 // This keeps both combatants balanced around the screen center.
 if(hasTarget){
  cameraDesiredLook.set(
   (p.x+t.x)*.5,
   (p.y+t.y)*.5+1.35,
   (p.z+t.z)*.5
  );
 }else{
  cameraDesiredLook.set(
   p.x+cameraForward.x*12,
   p.y+1.45,
   p.z+cameraForward.z*12
  );
 }
 camera.up.set(0,1,0);
 camera.lookAt(cameraDesiredLook);
 camera.updateMatrixWorld(true);
}
function render(now){requestAnimationFrame(render);const dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);
 const p=units[0];
 if(p){
  const t=targetFor(p);
  updateCombatCamera(p,t,dt);
  camera.updateProjectionMatrix();
  updateUnitHp();
  const marker=$('lockMarker');
  if(started&&t&&t.alive){
   // Anchor the lock marker to a point just above the target's torso, independent of the HP bar.
   // Projecting this world-space point keeps it over the body from every camera angle.
   const projected=new THREE.Vector3(t.x,t.y+1.35,t.z).project(camera);
   const visible=projected.z>-1&&projected.z<1&&Math.abs(projected.x)<1.2&&Math.abs(projected.y)<1.2;
   const hp=hpEls[targetIndex];
   marker.style.display=visible?'block':'none';
   const lockState=isYellowLocked(t)?'yellow':(dist(p,t)<=p.redLockRange?'red':'green');marker.classList.toggle('lock-yellow',lockState==='yellow');marker.classList.toggle('lock-green',lockState==='green');
   if(visible){
    const markerX=(projected.x*.5+.5)*innerWidth;
    const markerY=(-projected.y*.5+.5)*innerHeight;
    marker.style.left=markerX+'px';
    marker.style.top=markerY+'px';
    // HP bar follows the marker with a fixed gap; the marker is the positioning anchor.
    // .unitHp uses translate(-50%,-100%), so `top` is its bottom edge.
    if(hp){
     hp.style.display='block';
     hp.style.left=markerX+'px';
     hp.style.top=(markerY-54/2-10)+'px';
    }
   }
  }else marker.style.display='none';
 }else $('lockMarker').style.display='none';

const zone=$('stickZone'),stick=$('stick');let stickId=null;
