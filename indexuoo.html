<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

 const stripe=new THREE.Mesh(new THREE.BoxGeometry(w*.78,.06,.08),mat(0x4fcde8,.2,.4));stripe.position.set(x,base+h*.68,z-d/2-.045);scene.add(stripe);

}
// No visible arena grid or wireframe boundary: keep the field natural and open.

 }
}
const projectileGroup=new THREE.Group();scene.add(projectileGroup);const effects=[];
let units=[],shots=[],elapsed=0,started=false,over=false,targetIndex=2,costA=6000,costB=6000,fireHeld=false,move={x:0,y:0},keys={},difficulty='normal',last=performance.now();let boostPressActive=false,boostPressStarted=0,boostMode='',boostHoldTimer=null,lastBoostTap=-9999;
const hpEls=[];for(let i=0;i<4;i++){const el=document.createElement('div');el.className='unitHp '+(i===0?'player':i===1?'ally':'enemy');el.innerHTML='<div class="hpName"></div><div class="hpTrack"><div class="hpFill"></div></div>';el.style.display='none';$('unitHpLayer').appendChild(el);hpEls.push(el)}
const stats={
 balanced:{hp:1000,speed:9.2,shot:54,rate:.88,ammo:8,reload:1.25,melee:155,boost:1000,regen:520,cost:3000,color:0x42dff5},
 ranged:{hp:1000,speed:8.7,shot:75,rate:1.02,ammo:10,reload:1.05,melee:120,boost:1000,regen:500,cost:3000,color:0x9c88ff},
 melee:{hp:1100,speed:9.1,shot:40,rate:1.12,ammo:5,reload:1.45,melee:220,boost:950,regen:540,cost:3000,color:0xff7ec8},
 light:{hp:850,speed:11.4,shot:48,rate:.78,ammo:7,reload:1.3,melee:125,boost:1200,regen:590,cost:2000,color:0x73ffb0}
};
function robotMesh(color,player=false){
 const root=new THREE.Group(), body=mat(color,.65,.3), dark=mat(0x152637,.65,.35), glow=mat(0x9cf7ff,.25,.18), joint=mat(0x516b7b,.8,.35);

 return {name,team,x,z,y:groundHeight(x,z),vy:0,vx:0,vz:0,grounded:true,boostDash:false,boostLift:false,dashTime:0,lastBoostTap:0,ammo:s.ammo,maxAmmo:s.ammo,ammoReload:0,action:'idle',actionTime:0,hp:s.hp,maxHp:s.hp,alive:true,respawn:0,mesh,player,kind,stats:s,fire:0,melee:0,special:0,boost:s.boost,maxBoost:s.boost,boosting:0,step:0,stun:0,face:team===0?Math.PI:0,ai:Math.random()*5,respawnCost:s.cost};

function removeUnit(u){scene.remove(u.mesh);u.alive=false;u.mesh.visible=false}
function reset(){
 for(const u of units)scene.remove(u.mesh);for(const s of shots)scene.remove(s.mesh);for(const e of effects)scene.remove(e.mesh);

 units=[spawn('YOU',0,-24,0,kind,true),spawn('ALLY',0,-29,8,'balanced'),spawn('ENEMY 1',1,24,-6,'balanced'),spawn('ENEMY 2',1,30,9,'light')];
 elapsed=0;over=false;targetIndex=2;costA=6000;costB=6000;started=true;move={x:0,y:0};fireHeld=false;boostPressActive=false;boostMode='';clearTimeout(boostHoldTimer);

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.z-b.z)}
function targetFor(u){let opts=units.filter(v=>v.team!==u.team&&v.alive);if(!opts.length)return null;if(u.player){let t=units[targetIndex];return t&&t.alive?t:opts[0]}return opts.sort((a,b)=>dist(u,a)-dist(u,b))[0]}

function animateAction(u,name,duration){u.action=name;u.actionTime=duration; if(u.mesh.userData.weapon)u.mesh.userData.weapon.rotation.x=name==='shoot'?-0.65:-0.1;}
function addEffect(x,y,z,color,size=1,life=.25){

const MAX_SHOT_PITCH=Math.PI/3;

function doStep(u){if(!u.alive||u.step>0||u.boost<130)return;for(const shot of shots){if(shot.target===u)shot.target=null;}u.step=.32;u.boost-=130;let x=move.x,z=move.y;const fX=-Math.sin(u.face),fZ=-Math.cos(u.face),rX=Math.cos(u.face),rZ=-Math.sin(u.face);let wx=rX*x+fX*z,wz=rZ*x+fZ*z;if(Math.hypot(wx,wz)<.2){wx=-fX;wz=-fZ}const m=Math.hypot(wx,wz)||1;u.vx=wx/m*22;u.vz=wz/m*22;u.stun=.04;animateAction(u,'step',.28);addEffect(u.x,.7,u.z,0x7ebcff,.8,.2)}

function update(dt){

  u.mesh.position.set(u.x,u.y+(u.grounded?Math.sin(elapsed*8+u.ai)*.025:0),u.z);u.mesh.rotation.y=u.face;

function updateHud(){

 if(p){$('boostFill').style.width=(p.boost/p.maxBoost*100)+'%';const arc=(id,ratio)=>$(id).style.setProperty('--arc-angle',(Math.max(0,Math.min(1,ratio))*90)+'deg');const reloadProgress=p.ammo<p.maxAmmo?Math.max(0,Math.min(1,1-p.ammoReload/Math.max(.01,p.stats.reload))):0;arc('shoot',(p.ammo+reloadProgress)/p.maxAmmo);arc('boost',p.boost/p.maxBoost);arc('melee',1-p.melee/.72);arc('special',1-p.special/5);arc('step',1-p.step/.32);arc('lock',1)}

function updateUnitHp(){

function render(now){requestAnimationFrame(render);const dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);

  const behind=new THREE.Vector3(p.x+Math.sin(p.face)*9,p.y+5.2,p.z+Math.cos(p.face)*9);

   }

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7))});
const zone=$('stickZone'),stick=$('stick');let stickId=null;
